name: Labeling new issue
on:
  issues:
    types: ['opened']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Renato66/auto-label@v2
        with:
          repo-token: ${{ secrets.GITHUB_USER_TOKEN }}
          ignore-comments: true
          labels-synonyms: '{
            "Medium":["Medium"],
            "Critical":["Critical"]
          }'
#          labels-not-allowed: '["good first issue"]'
          default-labels: '["Minor"]'