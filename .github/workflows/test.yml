# thanks to Renato66 for his Github Action

name: Running Test on Pull Request
on:
  pull_request:
    types: ['opened', 'ready_for_review']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install dependencies
        run: cd ./Website composer install --prefer-dist --no-progress --no-suggest

      - name: PHPUnit
        uses: chindit/actions-phpunit-symfony@master